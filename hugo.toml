baseURL = "https://qqpp17.github.io/"
defaultContentLanguage = "zh-cn"
locale = "zh-cn"
title = "潘华珍的博客"
theme = "hugo-theme-dream"

[params]
# 多彩主题：亮色用 autumn（秋日暖色），暗色用 synthwave（霓虹炫酷）
lightTheme = "autumn"
darkTheme = "synthwave"

# 背景图
backgroundImage = "img/rose-bg.jpg"
backgroundImageDark = "img/rose-bg-dark.jpg"

# 站点信息
author = "潘华珍"
avatar = "img/avatar.png"
favicon = "img/favicon.png"
headerTitle = "潘华珍的博客"
motto = "记录学习与生活的多彩瞬间 ✨"
siteStartYear = 2026
description = "潘华珍的个人博客 - 记录学习笔记、技术分享与生活点滴"
email = "qqpp17@example.com"

# 界面选项
stickyNav = true
showTableOfContents = true
showPrevNextPost = true
imageZoomableInPost = true

# 自定义页脚签名
footerBottomText = "🌹 用心打造 · Powered by <a class='hover:underline' href='https://gohugo.io/' target='_blank'>Hugo</a> · Theme <a class='hover:underline' href='https://github.com/g1eny0ung/hugo-theme-dream' target='_blank'>Dream</a>"

# 导航栏顺序
reorderNavItems = ["about", "posts", "categories", "tags"]

# 高级配置
[params.advanced]
customCSS = ["css/custom.css"]
